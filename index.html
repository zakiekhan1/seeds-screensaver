    if(style==='trace'){

    const Jnoon=J2000+ds+.0053*Math.sin(M)-.0069*Math.sin(2*L);
    const w=Math.acos((Math.sin(-.833*rad)-Math.sin(LAT*rad)*Math.sin(dec))/(Math.cos(LAT*rad)*Math.cos(dec)));
    const a=w/(2*Math.PI), Jset=J2000+.0009+(w+lw)/(2*Math.PI)+n+.0053*Math.sin(M)-.0069*Math.sin(2*L), Jrise=Jnoon-(Jset-Jnoon);
    const hrs=dt=>dt.getHours()+dt.getMinutes()/60+dt.getSeconds()/3600;
    return {rise:hrs(fromJ(Jrise)), noon:hrs(fromJ(Jnoon)), set:hrs(fromJ(Jset))};
  }
  function keyframes(d){
    const {rise,noon,set}=sunHours(d);
    return [
      [rise-3,'espresso'], [rise-1.5,'kraft'], [rise,'sand'], [rise+1.5,'parchment'],
      [set-2,'parchment'], [set-.5,'oat'],
      [set+1,'sand'], [set+2.5,'kraft'], [set+4.5,'espresso'], [rise-3+24,'espresso']
    ];
  }
  function blendAt(d){
    const h=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600, K=keyframes(d);
    let hh=h; if(hh<K[0][0]) hh+=24;
    for(let i=0;i<K.length-1;i++){ const [t0,a]=K[i],[t1,b]=K[i+1];
      if(hh>=t0&&hh<=t1){ let k=t1===t0?0:(hh-t0)/(t1-t0); k=k*k*(3-2*k); return [PAL[a],PAL[b],k]; } }
    return [PAL.espresso,PAL.espresso,0];
  }
  const creamMark=document.querySelector('canvas.mark.cream'), inkMark=document.querySelector('canvas.mark.ink');
  function simNow(){ const t=performance.now()/1000+T0;
    if(MODE!=='cycle') return new Date(Date.now()+T0*1000);
    const d=new Date(); d.setHours(4,0,0,0); return new Date(d.getTime()+((t%60)/60)*864e5); }
  const FIX={day:'parchment',afternoon:'oat',evening:'sand',dusk:'kraft',night:'espresso'};
  function applyPalette(){
    const [A,B,k]=FIX[PALQ]&&MODE!=='cycle'?[PAL[FIX[PALQ]],PAL[FIX[PALQ]],0]:blendAt(simNow()), mix=(x,y)=>x.map((v,i)=>Math.round(v+(y[i]-v)*k)), lerp=(x,y)=>x+(y-x)*k;
    const p=mix(A.paper,B.paper), hex='#'+p.map(v=>v.toString(16).padStart(2,'0')).join('');
    sc.paper=hex; sc.line=mix(A.line,B.line).join(','); sc.lmaj=lerp(A.lmaj,B.lmaj); sc.lmin=lerp(A.lmin,B.lmin);
    sc.el.style.setProperty('--markBg',hex); document.documentElement.style.background=hex; document.body.style.background=hex; sc.el.style.setProperty('--paper',hex); sc.el.style.setProperty('--paperT','rgba('+p.join(',')+',0)');
    const cream=lerp(A.cream,B.cream); inkMark.style.opacity=(1-cream).toFixed(3); creamMark.style.opacity=cream.toFixed(3);
    const tc=mix(A.text,B.text).join(',');
    document.querySelector('.sig').style.color=`rgba(${tc},.55)`; document.querySelector('.sig b').style.color=`rgba(${tc},.72)`; document.querySelector('.coord').style.color=`rgba(${tc},.42)`; document.querySelector('.big b').style.color=`rgba(${tc},.80)`; document.querySelector('.big i').style.color=`rgba(${tc},.62)`;
  }
  applyPalette(); setInterval(applyPalette,MODE==='cycle'?80:30000);
  if(MODE==='cycle'){ canvases.forEach(c=>c.style.transition='none'); }
  function tickClock(){ const n=simNow();
    document.getElementById('clock').textContent=n.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
    document.getElementById('date').textContent=MODE==='cycle'?'One day in Austin · 60 seconds':n.toLocaleDateString([], {weekday:'long'})+' · '+n.toLocaleDateString([], {month:'long',day:'numeric'});
    document.getElementById('btime').textContent=n.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M$/i,'');
    document.getElementById('bdate').textContent=n.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'}); }
  tickClock(); setInterval(tickClock,MODE==='cycle'?250:5000);
  let lastT3=performance.now()/1000, lastFrame=0;
  function loop(ts){ requestAnimationFrame(loop); if(document.hidden) return; if(ts-lastFrame<1000/30-2) return; lastFrame=ts;
    const t=ts/1000, dt=Math.min(.05,t-lastT3); lastT3=t; const tt=t+T0; drive(tt,dt); drawAll(t,dt); (SHEET2?sheet2:(ALT[MODE]||drawRelief))(sc,reduce?0:t,dt); }
  const plane=document.querySelector('.plane'), haze=document.querySelector('.haze');
  const ez=x=>{x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x);};
  let lastDone=-1;
  function drive(t,dt){
    let rate=1;
    if(MODE==='growth'){ const c=inkMark; if(c._t0!==undefined){ const u=((t-T0-c._t0)%22+22)%22; if(u>7.5&&u<10.5) rate=1+7*Math.sin((u-7.5)/3*Math.PI); } }
    if(MODE==='cycle') rate=1.6;
    sc.ph=MODE==='flyover'?(reduce?0:((Date.now()/1000)%100000)/7):(sc.ph||0)+(reduce?0:dt*rate/7);
    if(MODE!=='flyover'||reduce) return;
    // a slow drone flight: lift off from the wallpaper framing, then drift and bank over the relief
    const e=ez(t/16);
    const w=(Date.now()/1000)%100000;  // wall clock, so both displays fly in step
    const tilt=e*(32+6*Math.sin(w*.041)), rz=e*(9*Math.sin(w*.019)+3*Math.sin(w*.047)), s=1+e*(.16+.07*Math.sin(w*.029));
    const px=e*(5*Math.sin(w*.017+1)), py=e*(2.5*Math.cos(w*.023));
    plane.style.transform=`translate(${px}vw,${py}vh) rotateX(${tilt}deg) rotateZ(${rz}deg) scale(${s})`;
    haze.style.opacity=(e*.95).toFixed(3);
  }
  canvases.forEach(c=>{c.style.transition='none';}); setTimeout(()=>{ if(MODE!=='cycle') canvases.forEach(c=>c.style.transition=''); },1500);
  canvases.forEach(fit); addEventListener('resize',()=>{ canvases.forEach(fit); sc.grid=null; });
  requestAnimationFrame(loop);

})();
</script>
